
services:
  # ============== Central Identity Provider ==============
  - type: web
    name: abu-sso
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OIDC_ISSUER
        value: https://abu-sso.onrender.com
      - key: OIDC_PRIVATE_KEY_B64
        sync: false
      - key: OIDC_PUBLIC_KEY_B64
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ============== Student Portal ==============
  - type: web
    name: abu-sso-portal
    runtime: python
    plan: free
    rootDir: mock-services/portal
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: IDP_URL
        value: https://abu-sso.onrender.com
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_REDIRECT_URI
        value: https://abu-sso-portal.onrender.com/auth/callback
      - key: SESSION_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"

