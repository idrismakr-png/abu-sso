services:
  - type: web
    name: abu-sso
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false  # We'll set this manually in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.12.0"