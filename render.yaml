databases:
  - name: abu-sso-db
    databaseName: abu_sso
    user: abu_sso_user
    plan: free

services:
  - type: web
    name: abu-sso
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abu-sso-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"