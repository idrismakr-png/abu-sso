services:
  # ============== Main App ==============
  - type: web
    name: abu-sso
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ============== Mock Services ==============
  - type: web
    name: abu-sso-portal
    runtime: python
    plan: free
    rootDir: mock-services/portal
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: IDP_URL
        value: https://abu-sso.onrender.com
      - key: PYTHON_VERSION
        value: "3.12.0"

